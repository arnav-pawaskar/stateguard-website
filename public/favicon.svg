<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="StateGuard">
  <!-- Same "Keyed G" mark as the <Wordmark> lockup in src/components/Logo.jsx.
       Standalone file, so it cannot read the site's tokens: the theme values are
       inlined and flipped with prefers-color-scheme, since the browser draws this
       against its own tab chrome, not against our page. -->
  <style>
    .ring { stroke: #171410; }
    .a { stop-color: #0b9c86; }
    .b { stop-color: #6d4bd6; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #edeff6; }
      .a { stop-color: #22e0c4; }
      .b { stop-color: #8b7bff; }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="15.5" y1="13.6" x2="30" y2="18">
      <stop class="a" offset="0" />
      <stop class="b" offset="1" />
    </linearGradient>
  </defs>
  <path
    class="ring"
    d="M24.17 8.64A11 11 0 1 0 24.17 23.36"
    fill="none"
    stroke-width="4.8"
    stroke-linecap="round"
  />
  <rect x="15.5" y="13.6" width="14.5" height="4.8" rx="2.4" fill="url(#g)" />
</svg>
