<!doctype html>
<html lang="en" data-theme="light" data-accent="teal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StateGuard — Self-healing contracts for AI pipelines</title>
    <meta
      name="description"
      content="StateGuard sits between your LLM's output and your typed schema — catching field drift and type mismatches, then repairing them automatically before they crash your agents."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://stateguard.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StateGuard" />
    <meta property="og:url" content="https://stateguard.dev/" />
    <meta property="og:title" content="StateGuard — Self-healing contracts for AI pipelines" />
    <meta
      property="og:description"
      content="StateGuard sits between your LLM's output and your typed schema — catching field drift and type mismatches, then repairing them automatically before they crash your agents."
    />
    <!-- TODO: add a 1200×630 PNG at /og.png and an <meta property="og:image"> +
         <meta name="twitter:image"> pointing at it, then switch the card below to
         summary_large_image. Social scrapers do not render SVG. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="StateGuard — Self-healing contracts for AI pipelines" />
    <meta
      name="twitter:description"
      content="Catch field drift and type mismatches in LLM output, and repair them before they crash your agents."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so a dark session never
      // flashes the light default.
      // CSP allowlists this script by sha256 hash (vercel.json) instead of
      // 'unsafe-inline' — editing so much as a byte of it (including this
      // comment) invalidates the hash and the browser silently blocks it,
      // which just means a light-flash on dark sessions, not a broken page.
      // Regenerate by hashing the exact text between this script tag's
      // opening ">" and its closing tag (see scripts/csp-hash.py).
      try {
        var t = localStorage.getItem('stateguard-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
